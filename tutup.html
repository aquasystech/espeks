<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permohonan Ditutup</title>
    <script src="api.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #153f6a;
        margin: 0;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        width: 80%;
        max-width: 900px;
        margin: 40px auto;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 2px solid #ccc;
      }
      .header img {
        height: 80px;
      }
      .header .title {
        text-align: center;
      }
      .header .title h1 {
        font-size: 24px;
        font-weight: bold;
        color: #333;
      }
      .header .title p {
        font-size: 18px;
        color: #333;
      }
      .notice h2 {
        font-size: 28px;
        color: #dc3545;
        margin-bottom: 10px;
      }
      .notice p {
        font-size: 16px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
        <header class="header">
            <img src="https://raw.githubusercontent.com/usopdrahman/logbookdof/main/LOGO%20JABATAN%20PERIKANAN%20MALAYSIA.png" alt="Jata Negara" onerror="this.style.display='none'">
            <div class="title">
                <h1>Borang Permohonan Bantuan Input</h1>
                <p>Jabatan Perikanan Malaysia</p>
            </div>
            <img src="https://github.com/usopdrahman/logbookdof/blob/main/DOF%20LOGO.png?raw=true" alt="Logo Jabatan Perikanan Malaysia"  onerror="this.style.display='none';">
        </header>
        <div class="notice">
            <h2>Permohonan Ditutup</h2>
            <p>Dukacita dimaklumkan, tempoh permohonan bantuan telah ditutup buat masa ini.</p>
            <p>Sila rujuk laman web rasmi Jabatan Perikanan Malaysia untuk maklumat lanjut mengenai tarikh permohonan akan datang.</p>
        </div>
    </div>
  </body>
</html>
